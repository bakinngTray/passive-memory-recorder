name: RuStore release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PMR_KEYSTORE_PATH: ${{ github.workspace }}/release.jks
      PMR_KEYSTORE_PASSWORD: ${{ secrets.PMR_KEYSTORE_PASSWORD }}
      PMR_KEY_ALIAS: ${{ secrets.PMR_KEY_ALIAS }}
      PMR_KEY_PASSWORD: ${{ secrets.PMR_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Restore release keystore
        env:
          PMR_KEYSTORE_BASE64: ${{ secrets.PMR_KEYSTORE_BASE64 }}
        run: |
          test -n "$PMR_KEYSTORE_BASE64" || (echo "Missing PMR_KEYSTORE_BASE64" && exit 1)
          test -n "$PMR_KEYSTORE_PASSWORD" || (echo "Missing PMR_KEYSTORE_PASSWORD" && exit 1)
          test -n "$PMR_KEY_ALIAS" || (echo "Missing PMR_KEY_ALIAS" && exit 1)
          test -n "$PMR_KEY_PASSWORD" || (echo "Missing PMR_KEY_PASSWORD" && exit 1)
          printf '%s' "$PMR_KEYSTORE_BASE64" | base64 --decode > "$PMR_KEYSTORE_PATH"

      - name: Build signed release APK and AAB
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify APK signature
        run: apksigner verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload RuStore release
        uses: actions/upload-artifact@v4
        with:
          name: passive-memory-recorder-rustore
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90
