plugins {
    id 'com.android.application'
}

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('keystore.properties')
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

def signingStoreFile = System.getenv('PMR_KEYSTORE_PATH') ?: signingProperties.getProperty('storeFile')
def signingStorePassword = System.getenv('PMR_KEYSTORE_PASSWORD') ?: signingProperties.getProperty('storePassword')
def signingKeyAlias = System.getenv('PMR_KEY_ALIAS') ?: signingProperties.getProperty('keyAlias')
def signingKeyPassword = System.getenv('PMR_KEY_PASSWORD') ?: signingProperties.getProperty('keyPassword')
def hasReleaseSigning = signingStoreFile && signingStorePassword && signingKeyAlias && signingKeyPassword

android {
    namespace 'com.bakinngtray.passivememoryrecorder'
    compileSdk 36

    defaultConfig {
        applicationId 'com.bakinngtray.passivememoryrecorder'
        minSdk 29
        targetSdk 36
        versionCode 2
        versionName '0.2.0'
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile rootProject.file(signingStoreFile)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
